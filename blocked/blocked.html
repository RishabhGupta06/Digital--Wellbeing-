<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Wellbeing - Blocked</title>
    <link rel="stylesheet" href="blocked.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <div class="icon-container">
            <svg class="lock-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
        </div>
        <h1 class="title">Time's Up!</h1>
        <p class="message" id="reason-message">You've reached your limit for this website.</p>
        
        <div class="actions">
            <button id="dashboard-btn" class="btn primary-btn">Open Dashboard</button>
            <button id="close-btn" class="btn secondary-btn">Close Tab</button>
        </div>
    </div>
    <script src="blocked.js"></script>
</body>
</html>
